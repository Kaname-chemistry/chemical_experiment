<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================================================================
   Chemistry constants  (2 NaHCO3 -> Na2CO3 + H2O + CO2)
   ================================================================ */
const M = { NaHCO3: 84.01, Na2CO3: 105.99, H2O: 18.02, CO2: 44.01 };
const SAMPLE_G = 2.00;
const N0 = SAMPLE_G / M.NaHCO3;          // 0.02381 mol
const VM = 24500;                         // mL/mol, 25 °C, 1 atm
const LIME_CAP = 2.3e-4;                  // mol Ca(OH)2 in ~10 mL saturated lime water
const ABSORB = 0.02;                      // fraction of CO2 bubbles actually absorbed
const T_ROOM = 25, T_HOT = 260;
const CRACK_T = 150;                      // liquid water on glass hotter than this -> thermal shock

/* ================================================================
   Renderer, scene, camera
   ================================================================ */
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const isMobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = srgb(0.79, 0.83, 0.86);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.3, 500);
scene.add(camera);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 150; controls.maxPolarAngle = 1.52; controls.minPolarAngle = 0.1;
function frameCamera() {
  const a = innerWidth / innerHeight;
  const dist = a < 1 ? 42 / Math.pow(a, 0.8) : 50;
  controls.target.set(a < 1 ? -8.5 : -2.5, a < 1 ? 12 : 10.5, 1);
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.12, 0.33, 0.94).normalize(), dist);
  controls.update();
}
frameCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x7b838a, 0.95));
const sun = new THREE.DirectionalLight(0xfff8ee, 2.2);
sun.position.set(26, 70, 36); sun.target.position.set(-6, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 40, top: 40, bottom: -36, near: 20, far: 160 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xe6efff, 0.55); fillL.position.set(-36, 26, 24); scene.add(fillL);
const flameLight = new THREE.PointLight(0x6688ff, 0, 0, 2); flameLight.position.set(0, 17, 0); scene.add(flameLight);

/* ---------- helpers ---------- */
const V2 = (x, y) => new THREE.Vector2(x, y);
function tex(w, h, draw, o = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (o.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  if (o.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }
  return t;
}
function add(geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.p) m.position.set(...o.p);
  if (o.r) m.rotation.set(...o.r);
  if (o.s) m.scale.set(...o.s);
  m.castShadow = !!o.cast; m.receiveShadow = !!o.recv;
  if (o.ro !== undefined) m.renderOrder = o.ro;
  (o.to || scene).add(m);
  return m;
}
function glass(o = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: o.color ?? 0xffffff, roughness: 0.04, metalness: 0, ior: 1.5,
    transparent: true, opacity: o.op ?? 0.12, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: o.env ?? 1.6 });
  const k = (o.edge ?? 0.5).toFixed(2);
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `{ float e = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition)));
         e = e * e * e; diffuseColor.a = clamp(diffuseColor.a + e * ${k}, 0.0, 0.9); outgoingLight += vec3(e * 0.05); }
       #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'g' + k;
  return m;
}
// test tube lathe: round bottom at y=0, open rim at y=L
function tubeGeo(R, L, wall = 0.08, seg = 40) {
  const pts = [];
  for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + (i / 10) * Math.PI / 2; pts.push(V2(R * Math.cos(a), R + R * Math.sin(a))); }
  pts.push(V2(R, L), V2(R + 0.06, L + 0.04), V2(R - wall, L + 0.02));
  const ri = R - wall;
  pts.push(V2(ri, L));
  for (let i = 10; i >= 0; i--) { const a = -Math.PI / 2 + (i / 10) * Math.PI / 2; pts.push(V2(ri * Math.cos(a), R + ri * Math.sin(a))); }
  return new THREE.LatheGeometry(pts, seg);
}
function label(text, sub, w = 256, h = 128, band = '#3d5566') {
  return tex(w, h, (g) => {
    g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
    g.fillStyle = band; g.fillRect(0, 0, w, 14);
    g.fillStyle = '#111a21'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `800 ${Math.min(44, Math.floor(w * 1.5 / Math.max(4, text.length)))}px system-ui,"Hiragino Sans","Noto Sans JP",IPAPGothic,sans-serif`; g.fillText(text, w / 2, 60);
    g.font = '500 18px system-ui,"Hiragino Sans","Noto Sans JP",IPAPGothic,sans-serif'; g.fillStyle = '#4b5e6b'; g.fillText(sub, w / 2, 104);
  });
}
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp01 = (x) => Math.max(0, Math.min(1, x));

/* ================================================================
   Room
   ================================================================ */
const benchMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#3b4044'; g.fillRect(0, 0, w, h);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
}, { rep: [5, 2.5] });
add(new THREE.BoxGeometry(140, 4, 60), new THREE.MeshStandardMaterial({ map: benchMap, roughness: 0.94, envMapIntensity: 0.45 }), { p: [-4, -2, -4], recv: true });
const wallMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#c1c9cf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const v = 230 + ((i * 7 + j * 3) % 9); g.fillStyle = `rgb(${v - 3},${v + 1},${v + 4})`;
    g.fillRect(i * 128 + 3, j * 128 + 3, 122, 122);
  }
}, { rep: [12, 6] });
add(new THREE.PlaneGeometry(140, 70), new THREE.MeshStandardMaterial({ map: wallMap, roughness: 0.55, envMapIntensity: 0.6 }), { p: [-4, 35, -34], recv: true });

/* ================================================================
   Bunsen burner + gas tap
   ================================================================ */
const brass = new THREE.MeshStandardMaterial({ color: 0xc9a25a, metalness: 1, roughness: 0.32 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xd2d6da, metalness: 1, roughness: 0.22 });
const castIron = new THREE.MeshStandardMaterial({ color: 0x2d3338, metalness: 0.4, roughness: 0.55 });
const BURNER_TOP = 13;
add(new THREE.LatheGeometry([V2(0, 0), V2(4.3, 0), V2(4.4, 0.25), V2(4.1, 0.6), V2(2.2, 1.1), V2(1.1, 1.7), V2(0.95, 2.1), V2(0, 2.1)], 48), castIron, { cast: true, recv: true });
add(new THREE.CylinderGeometry(0.62, 0.62, BURNER_TOP - 2.1, 32, 1, true), brass, { p: [0, 2.1 + (BURNER_TOP - 2.1) / 2, 0], cast: true });
add(new THREE.TorusGeometry(0.62, 0.06, 8, 32), brass, { p: [0, BURNER_TOP, 0], r: [Math.PI / 2, 0, 0] });
add(new THREE.CylinderGeometry(0.56, 0.56, 0.3, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9, side: THREE.BackSide }), { p: [0, BURNER_TOP - 0.15, 0] });
const collar = add(new THREE.CylinderGeometry(0.78, 0.78, 1.6, 32), brass, { p: [0, 3.3, 0], cast: true });
add(new THREE.CircleGeometry(0.32, 20), new THREE.MeshStandardMaterial({ color: 0x15110c, roughness: 1 }), { p: [0.22, 0, 0.75], r: [0, 0.28, 0], to: collar });
const INLET_DIR = new THREE.Vector3(0.8, 0, -0.6).normalize();
const inlet = new THREE.Group(); inlet.position.set(1.0, 1.25, -0.75); inlet.rotation.y = Math.atan2(INLET_DIR.x, INLET_DIR.z); scene.add(inlet);
add(new THREE.CylinderGeometry(0.32, 0.32, 2.4, 16), brass, { p: [0, 0, 1.2], r: [Math.PI / 2, 0, 0], to: inlet, cast: true });
for (let i = 0; i < 3; i++) add(new THREE.CylinderGeometry(0.3, 0.42, 0.35, 16), brass, { p: [0, 0, 1.55 + i * 0.4], r: [Math.PI / 2, 0, 0], to: inlet });
const inletEnd = new THREE.Vector3(); inlet.updateMatrixWorld(); inlet.localToWorld(inletEnd.set(0, 0, 2.2));
const TAP = new THREE.Vector3(17, 0, -18);
add(new RoundedBoxGeometry(5, 9, 5, 2, 0.5), new THREE.MeshStandardMaterial({ color: 0xd8dde0, roughness: 0.6 }), { p: [TAP.x, 4.5, TAP.z], cast: true, recv: true });
add(new THREE.CylinderGeometry(0.5, 0.5, 2.6, 16), chrome, { p: [TAP.x, 6.4, TAP.z + 3.6], r: [Math.PI / 2, 0, 0], cast: true });
add(new THREE.SphereGeometry(0.95, 20, 14), chrome, { p: [TAP.x, 6.4, TAP.z + 4.2], cast: true });
const nozzle = new THREE.Group(); nozzle.position.set(TAP.x, 6.4, TAP.z + 4.2); nozzle.rotation.x = 0.9; scene.add(nozzle);
add(new THREE.CylinderGeometry(0.3, 0.3, 2.2, 14), chrome, { p: [0, -1.4, 0], to: nozzle, cast: true });
for (let i = 0; i < 3; i++) add(new THREE.CylinderGeometry(0.28, 0.4, 0.32, 14), chrome, { p: [0, -1.5 - i * 0.38, 0], to: nozzle });

const TILT = { down: 0.1, level: 0, up: -0.26 };
function fresh() {

   ================================================================ */
function crackTube(reason) {
  if (S.broken) return;
  S.broken = reason; S.burner = false; crack.visible = true;

  S.run = null; runDrop.visible = false;
  logPush(reason, '破損', '#c0392b');

}
function sim(dt) {
  S.t += dt;
  // flame on/off ramp
  S.flameI += ((S.burner ? 1 : 0) - S.flameI) * (1 - Math.exp(-dt * 6));
  // temperature of the tube bottom / powder
  S.Tprev = S.T;
  if (S.burner) S.T += (T_HOT - S.T) * (1 - Math.exp(-dt / 6));
  else S.T += (T_ROOM - S.T) * (1 - Math.exp(-dt / 9));
  S.Tmax = Math.max(S.Tmax, S.T);
  // decomposition
  const k = S.T > 80 ? 0.07 * Math.pow((S.T - 80) / 100, 1.5) : 0;
  const dn = S.n * (1 - Math.exp(-k * dt));
  S.n -= dn;
  const gasMol = dn / 2;                    // mol CO2 and mol H2O produced this step
  S.co2mL += gasMol * VM;
  const water = gasMol * M.H2O;
  S.h2oMade += water;
  S.cond += water * 0.85;                   // most vapour condenses at the cooler mouth
  // gas leaving the outlet: CO2 + expansion of the air already in the tube (≈30 mL)
  const expand = Math.max(0, 30 * (S.T - S.Tprev) / (S.T + 273));
  S.flow = (gasMol * VM + expand) / Math.max(dt, 1e-6);

  S.lift += (S.liftTarget - S.lift) * (1 - Math.exp(-dt * 5));

    S.turb = Math.min(1, S.absorbed / LIME_CAP);
    if (!S.flags.air && S.flow > 0.5 && S.co2mL < 3) { S.flags.air = true; logPush('最初の泡は試験管から押し出された空気 — 石灰水はにごらない', '', '#bfe3f2'); }
    if (!S.flags.milky && S.turb > 0.08) { S.flags.milky = true; logPush('石灰水が白くにごった → 二酸化炭素が発生', 'CO₂', '#f1f1ec', 'ok'); }
  }
  if (!S.flags.water && S.cond > 0.015) { S.flags.water = true; logPush('試験管の口付近に液体がついた', '', '#dff0ff'); }
  if (!S.flags.done && conv() > 0.999) { S.flags.done = true; logPush(`分解完了：2.00 g → ${massSolid().toFixed(2)} g`, '完了', '#f6f6f2', 'ok'); }
  if (S.burner && !S.dipped && !S.flags.openAir && S.flow > 0.5) { S.flags.openAir = true; logPush('気体は空気中へ — 石灰水では調べていない', '', '#c8d0d6'); }

      if (!S.flags.runWarn) { S.flags.runWarn = true; toast('口元で冷えた水が、熱い底のほうへ流れていく！', true); }
    }
    if (S.run) {

      S.run.x += v * dt;
      if (S.run.x <= MOUTH_X + 1.2) { S.cond += S.run.amt; S.run = null; logPush('水が口元に戻った', 'セーフ', '#dff0ff', 'ok'); }
      else if (S.run.x >= POW_X - 2.0) {

    S.suckT += dt;
    if (S.suckT > 0.6) {
      if (!S.sucking) { S.sucking = true; toast('石灰水が逆流してくる — ガラス管を抜いて！', true); logPush('気体が冷え、水蒸気が水に戻って試験管内の圧力が下がる', '', '#e4f1f6'); }
      S.suck = Math.min(1, S.suck + dt / 3.2);
    }
    if (S.suck >= 1) crackTube('逆流：冷たい石灰水が熱い試験管に入り、割れた。火を消す前にガラス管を石灰水から抜こう。');
  } else {
    S.suckT = 0;
    if (S.suck > 0) {
      S.suck = Math.max(0, S.suck - dt / 0.7);
      if (S.suck === 0 && S.sucking && !S.broken) { S.sucking = false; logPush('間に合った — 石灰水は元に戻った', 'セーフ', '#e4f1f6', 'ok'); }
    }
  }
  if (Math.abs(S.theta - prevTh) > 1e-5 || Math.abs(S.lift - prevLift) > 1e-5 || !rubber) {
    tube.rotation.z = S.theta; dip.position.y = LIFT_H * S.lift; rebuildRubber();
  }
  // CoCl2 paper test animation
  if (S.co) {
    S.co.t += dt;
    const k2 = clamp01((S.co.t - 0.5) / 1.0);
    coPaperMat.color.copy(new THREE.Color(0x2b55c9)).lerp(new THREE.Color(0xf08fb0), S.co.pink ? k2 : 0);
    if (S.co.t > 4.5) { S.co = null; coPaper.visible = false; }
  }
  // phenolphthalein tubes
  for (const p of phLiq) {
    p.fill += (p.target - p.fill) * (1 - Math.exp(-dt * 3));
    p.col.lerp(p.toCol, 1 - Math.exp(-dt * (p.fill > 0.9 ? 2.5 : 0)));
    p.m.color.copy(p.col); p.m.opacity = 0.35 + 0.45 * p.colA * (p.fill > 0.9 ? 1 : 0.2);
    setPhFill(p);
  }
  hudDirty = true;
}
phLiq.forEach(p => p.colA = 0);

/* ================================================================
   Visual update (every frame)
   ================================================================ */
const dummy = new THREE.Object3D();
const limeClear = srgb(0.89, 0.95, 0.97), limeMilk = srgb(0.96, 0.96, 0.94);
function visuals(dt) {
  const fI = S.flameI;
  for (const m of [flameOuter, flameInner]) m.material.uniforms.uTime.value = S.t;
  flameOuter.material.uniforms.uInt.value = 0.7 * fI;
  flameInner.material.uniforms.uInt.value = 0.75 * fI;
  flameOuter.visible = flameInner.visible = fI > 0.01;
  glowMat.opacity = 0.3 * fI; flameLight.intensity = 30 * fI;
  // powder shrinks as mass is lost (density roughly similar)
  const f = Math.cbrt(massSolid() / SAMPLE_G);
  powder.scale.set(2.0 * f, 0.42 * f, 0.9 * f);
  powderMat.color.setRGB(0.965, 0.965, 0.95 - 0.02 * conv());
  // condensed droplets
  const nd = S.broken && S.run ? 0 : Math.min(ND, Math.round(S.cond / 0.005));
  drops.count = nd;
  for (let i = 0; i < nd; i++) { const d = dropPos[i]; dummy.position.set(d.x, d.y, d.z); dummy.scale.setScalar(d.s); dummy.updateMatrix(); drops.setMatrixAt(i, dummy.matrix); }
  drops.instanceMatrix.needsUpdate = true;
  const pv = downhill() === 'mouth' ? Math.min(1, S.cond / 0.12) : 0;
  pool.scale.set(0.9 * pv + 0.01, 0.12 * pv + 0.01, 0.7 * pv + 0.01);
  runDrop.visible = !!S.run;
  if (S.run) runDrop.position.set(S.run.x, -TR + 0.26, 0);
  // lime water level + turbidity
  setLimeLevel(LIME_LEVEL - 1.4 * S.suck);
  const tb = 1 - Math.exp(-4 * S.turb);
  limeMat.color.copy(limeClear).lerp(limeMilk, tb); limeMat.opacity = 0.28 + 0.62 * tb;
  suckCol.visible = S.suck > 0.01;
  if (suckCol.visible) {
    const y0 = LIME_LEVEL - 1.4 * S.suck - dip.position.y, h = Math.max(0.05, (DIP_LEN + DIP_Y0 - y0 - 0.3) * S.suck);
    suckCol.scale.y = h; suckCol.position.y = y0 + h / 2;
  }
  // bubbles
  const spawn = S.dipped && S.suck === 0 ? Math.min(30, S.flow * 0.35) : 0;
  S.bAcc = (S.bAcc || 0) + spawn * dt;
  const tipY = DIP_Y0 + dip.position.y, lvl = LIME_LEVEL - 1.4 * S.suck;
  let used = 0;
  for (const b of bub) {
    if (b.on) {
      b.y += b.v * dt; b.ph += dt * 9;
      if (b.y > lvl - 0.05) b.on = false;
    } else if (S.bAcc >= 1) {
      S.bAcc -= 1; b.on = true; b.x = (Math.random() - 0.5) * 0.3; b.z = (Math.random() - 0.5) * 0.3; b.y = tipY + 0.1;
      b.v = 3 + Math.random() * 2.5; b.r = 0.1 + Math.random() * 0.16; b.ph = Math.random() * 6;
    }
    if (b.on) {
      dummy.position.set(LIME.x + b.x + Math.sin(b.ph) * 0.12, b.y, LIME.z + b.z); dummy.scale.setScalar(b.r); dummy.updateMatrix();
      bubbles.setMatrixAt(used++, dummy.matrix);
    }
  }
  if (S.bAcc > 3) S.bAcc = 3;
  bubbles.count = used; bubbles.instanceMatrix.needsUpdate = true;
}

/* ================================================================
   HUD
   ================================================================ */
const $ = (id) => document.getElementById(id);
let hudDirty = true, hudT = 0;
function updateHud() {
  const c = conv();
  $('mass').innerHTML = `${massSolid().toFixed(2)}<small>g</small>`;
  $('conv').textContent = `分解 ${Math.round(c * 100)}%`;
  $('convBar').style.width = `${(c * 100).toFixed(1)}%`;
  $('temp').innerHTML = `${Math.round(S.T)}<small>°C</small>`;
  $('co2').innerHTML = `${Math.round(S.co2mL)}<small>mL</small>`;
  $('h2o').innerHTML = `${S.h2oMade.toFixed(2)}<small>g</small>`;
  const active = S.T > 100 && S.n / N0 > 0.01 && !S.broken;
  for (const i of [0, 1, 2, 3]) $('e' + i).classList.toggle('lit', active);
  const tb = 1 - Math.exp(-4 * S.turb);
  const col = limeMat.color.clone().convertLinearToSRGB();
  $('chip').style.background = `rgb(${Math.round(col.r * 255)},${Math.round(col.g * 255)},${Math.round(col.b * 255)})`;
  $('chip').style.opacity = 0.55 + 0.45 * tb;
  if (S.suck > 0.01) { $('lname').textContent = '逆流している！'; $('lnote').textContent = '試験管内の圧力が下がっている'; }
  else if (S.turb < 0.08) { $('lname').textContent = '無色透明'; $('lnote').textContent = S.dipped ? 'Ca(OH)₂ 水溶液' : 'ガラス管は抜いてある'; }
  else if (S.turb < 0.35) { $('lname').textContent = '白くにごり始めた'; $('lnote').textContent = 'CaCO₃ の沈殿ができている'; }
  else { $('lname').textContent = '白くにごった'; $('lnote').textContent = 'Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O'; }
}
const logEl = $('log'); const LOGMAX = 7;
function logPush(text, tag = '', color = '#fff', cls = '') {
  const e = logEl.querySelector('.empty'); if (e) e.remove();
  const li = document.createElement('li'); if (cls) li.className = cls;
  li.innerHTML = `<i style="background:${color}"></i><span>${text}</span>${tag ? `<em>${tag}</em>` : ''}`;
  logEl.prepend(li); while (logEl.children.length > LOGMAX) logEl.lastChild.remove();
}
let tt; function toast(s, warn = false) { const e = $('toast'); e.textContent = s; e.classList.toggle('warn', warn); e.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => e.style.opacity = 0, warn ? 3200 : 1900); }

/* ================================================================
   Controls
   ================================================================ */
function updateButtons() {
  const b = $('bBurn');
  b.textContent = S.burner ? '火を消す' : '火をつける'; b.classList.toggle('lit', S.burner);
  $('bLift').textContent = S.liftTarget > 0.5 ? 'ガラス管を入れる' : 'ガラス管を抜く';
  document.querySelectorAll('#tilt button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tilt));
}
function setBurner(on) {
  if (S.broken) { toast('試験管が割れています —「やり直す」を押してください'); return; }
  if (on === S.burner) return;
  S.burner = on;
  if (on) logPush(S.tilt === 'down' ? '点火 — 試験管の底を加熱' : `点火 — 試験管は${S.tilt === 'up' ? '口が上向き' : '水平'}`, '', '#6f8cff');
  else logPush(S.dipped ? '消火 — ガラス管は石灰水に入ったまま' : '消火', '', '#8899aa');
  updateButtons();
}
function setLift(up) {
  S.liftTarget = up ? 1 : 0;
  if (up && S.suck > 0) toast('ガラス管を引き上げています…');
  updateButtons();
}
function setTilt(t) {
  if (!(t in TILT) || t === S.tilt) return;
  S.tilt = t; updateButtons();
  if (t !== 'down') toast(t === 'up' ? '口が上向き：冷えた水が熱い底へ流れ戻るおそれ' : '水平：水が少しずつ底へ流れ戻るおそれ');
}
function testCoCl2() {
  if (S.burner) { toast('先に火を消して、試験管を冷ましてください'); return; }
  const water = S.cond + (S.run ? S.run.amt : 0);
  const pink = water > 0.01;
  S.co = { t: 0, pink }; coPaper.visible = true; coPaperMat.color.set(0x2b55c9);
  logPush(pink ? '塩化コバルト紙：青 → 赤（桃）→ 液体は水をふくむ（H₂O が発生）' : '塩化コバルト紙は青のまま — 口元にまだ液体がない', 'H₂O', pink ? '#f08fb0' : '#2b55c9', pink ? 'ok' : '');
}
function testPh() {
  if (S.burner) { toast('先に火を消してください'); return; }
  if (S.T > 60) { toast('試験管が冷めてから、残った固体を取り出そう'); return; }
  const c = conv();
  const faint = srgb(0.99, 0.9, 0.94), deep = srgb(0.86, 0.12, 0.5);
  phLiq[0].target = 1; phLiq[0].toCol = faint.clone(); phLiq[0].colA = 0.15;
  phLiq[1].target = 1; phLiq[1].toCol = faint.clone().lerp(deep, Math.pow(c, 0.8)); phLiq[1].colA = 0.15 + 0.85 * c;
  phLiq.forEach(p => { if (p.fill > 0.9) { p.fill = 0; p.col.set(0xf2f7f9); } });
  logPush(c < 0.1 ? 'フェノールフタレイン：どちらもうすい赤 — まだほとんど分解していない'
    : `フェノールフタレイン：加熱後の固体は${c > 0.8 ? '濃い' : ''}赤 — Na₂CO₃ は NaHCO₃ より強い塩基性`, 'pH', c < 0.1 ? '#fbe3ec' : '#d81f80', c >= 0.1 ? 'ok' : '');
  S.phDone = true;
}
function reset() {
  S = fresh();
  crack.visible = false; tubeMat.color.set(0xffffff); tubeMat.opacity = 0.13; coPaper.visible = false; runDrop.visible = false;
  phLiq.forEach(p => { p.fill = 0; p.target = 0; p.colA = 0; p.col.set(0xf2f7f9); p.toCol.set(0xf2f7f9); });
  tube.rotation.z = S.theta; dip.position.y = 0; rebuildRubber();
  logEl.innerHTML = '<li class="empty">ガスバーナーに火をつけて加熱を始めよう</li>';
  updateButtons(); hudDirty = true;
}
$('bBurn').addEventListener('click', () => setBurner(!S.burner));
$('bLift').addEventListener('click', () => setLift(S.liftTarget < 0.5));
$('bReset').addEventListener('click', reset);
$('bCo').addEventListener('click', testCoCl2);
$('bPh').addEventListener('click', testPh);
document.querySelectorAll('#tilt button').forEach(b => b.addEventListener('click', () => setTilt(b.dataset.t)));

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false); hudDirty = true;
}
addEventListener('resize', onResize);

/* ================================================================
   Loop
   ================================================================ */
tube.rotation.z = S.theta; rebuildRubber(); updateButtons(); onResize();
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!S.paused) { sim(dt); visuals(dt); }
  controls.update();
  hudT += dt;
  if (hudDirty && hudT > 1 / 15) { hudT = 0; hudDirty = false; updateHud(); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// hook for automated checks; has no effect on normal use
window.__soda = {
  get S() { return S; }, N0, M, conv, massSolid,
  setBurner, setLift, setTilt, testCoCl2, testPh, reset,
  click(id) { document.getElementById(id).click(); },
  step(sec, h = 1 / 60) { for (let t = 0; t < sec; t += h) { sim(h); visuals(h); } updateHud(); renderer.render(scene, camera); },
  hold(on) { renderer.setAnimationLoop(on ? null : frame); if (on) { controls.update(); updateHud(); renderer.render(scene, camera); } },
  view(t, p) { controls.target.set(...t); camera.position.set(...p); controls.update(); }
};
</script>
</body>
</html>
